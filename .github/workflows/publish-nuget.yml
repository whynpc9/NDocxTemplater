name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NDocxTemplater.sln

      - name: Build
        run: dotnet build NDocxTemplater.sln -c Release --no-restore

      - name: Test
        run: dotnet test NDocxTemplater.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/NDocxTemplater/NDocxTemplater.csproj -c Release --no-build -o artifacts

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: whynpc

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
